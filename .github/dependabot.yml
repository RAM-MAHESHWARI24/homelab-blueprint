# Dependabot keeps every pinned container image, Python dependency and GitHub
# Action current by opening pull requests. Images are pinned to version tags in
# the compose files (no :latest), so updates arrive as reviewable PRs instead
# of silently changing on a Watchtower schedule.
version: 2
updates:
  # Container images in each module's compose file
  - package-ecosystem: "docker-compose"
    directory: "/apps/mediaserver"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      mediaserver-images:
        patterns: ["*"]
    ignore:
      # Sonarr is updated by hand. Its tag streams confuse Dependabot: 5.x builds break
      # Prowlarr's Sonarr sync (HTTP 404, PR #12), and old "v4-4.0.0.x" tags sort as newer
      # than "4.0.20.x", so PR #19 proposed a downgrade that does not start.
      - dependency-name: "*linuxserver/sonarr"
      # Byparr is an optional profile that CI does not start, so majors need a manual test.
      - dependency-name: "*thephaseless/byparr"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker", "mediaserver"]

  - package-ecosystem: "docker-compose"
    directory: "/apps/noodle-gallery"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      noodle-gallery-images:
        patterns: ["*"]
    ignore:
      # Major updates need a migration plan, not a version bump (PR #7):
      # - Postgres 14 -> 16 cannot open the existing data directory without a dump/restore;
      # - the gallery server migrates its database forward on start and cannot go back.
      - dependency-name: "*immich-app/postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*open-noodle/gallery-*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker", "noodle-gallery"]

  - package-ecosystem: "docker"
    directory: "/apps/control-hub"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the tested Python line (CI covers 3.10-3.12 and does not build this
      # image); patch releases still come through (PR #4 proposed 3.15).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencies", "docker", "control-hub"]

  # Python requirements
  - package-ecosystem: "pip"
    directory: "/apps/control-hub"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies", "python"]

  - package-ecosystem: "pip"
    directory: "/apps/immich-face-xmp-exporter"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]

  - package-ecosystem: "pip"
    directory: "/apps/tv-autoupdater"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]

  # Workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
