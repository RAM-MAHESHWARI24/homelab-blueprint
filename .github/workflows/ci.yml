name: Homelab Blueprint CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-security:
    name: Linting & Secret Sanitization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify No Secrets Committed (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python for linting
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff Static Analysis (undefined names, unused imports, bug patterns)
        run: |
          pip install -q ruff
          ruff check . --output-format github

      - name: ShellCheck Static Analysis
        run: |
          shellcheck --severity=warning \
            bootstrap.sh \
            setup.sh \
            teardown.sh \
            apps/control-hub/run.sh \
            system/maintenance/watchtower-run.sh \
            system/power/immich-ml-control.sh \
            system/power/server-suspend.sh \
            apps/tv-updater/setup_cron.sh \
            apps/mediaserver/host/post-wake-arr.sh \
            apps/immich-face-xmp-exporter/scripts/immich_backup_gdrive.sh.example

  setup-wizard-test-matrix:
    name: Setup Wizard Matrix Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Control Hub Test Dependencies
        run: |
          pip install -r apps/control-hub/requirements.txt

      - name: Validate Documentation Integrity & Links
        run: |
          python testing/test_docs_integrity.py

      - name: Validate Configuration Schema Integrity
        run: |
          python setup/installer/schema_migrator.py --check

      - name: Execute Setup Wizard Verification Test Suite
        run: |
          python setup/test_setup.py

      - name: Execute E2E Pipeline Regression Suite
        run: |
          python testing/test_e2e_regression.py

      - name: Execute Full Lifecycle Handoff Regression Suite
        run: |
          python testing/test_lifecycle_handoff.py

  docker-compose-validation:
    name: Docker Compose & Multi-Arch Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Media Stack Compose Syntax
        run: |
          cd apps/mediaserver
          cp .env.example .env
          docker compose config --quiet
          echo "✅ apps/mediaserver docker-compose.yml is valid."
          # Every image must be pinned to a version tag (Dependabot keeps them current)
          ! grep -nE 'image:.*:(latest|release|main|develop)\s*$' docker-compose.yml

      - name: Validate Noodle Gallery Compose Syntax
        run: |
          cd apps/noodle-gallery
          cp .env.example .env
          # Secrets are required (no defaults shipped); supply CI-only values
          DB_PASSWORD=ci-only docker compose config --quiet
          echo "✅ apps/noodle-gallery docker-compose.yml is valid."
          ! grep -nE 'image:.*:(latest|release|main|develop)\s*$' docker-compose.yml

      - name: Validate Control Hub Standalone Compose Syntax
        run: |
          cd apps/control-hub
          cp .env.example .env
          CONTROL_HUB_TOKEN=ci-only QBITTORRENT_PASS=ci-only docker compose config --quiet
          echo "✅ apps/control-hub docker-compose.yml is valid."

      - name: Set up QEMU for Cross-Platform Simulation (ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Multi-Arch Image Availability
        run: |
          # Verify the pinned tags from the compose files publish both architectures
          mapfile -t IMAGES < <(grep -hoE 'image: *[^ ]+' apps/mediaserver/docker-compose.yml apps/noodle-gallery/docker-compose.yml | awk '{print $2}' | sort -u)
          for img in "${IMAGES[@]}"; do
            echo "Verifying multi-arch availability for $img..."
            if docker buildx imagetools inspect "$img" 2>/dev/null | grep -E "amd64|arm64" >/dev/null; then
              echo "✅ Verified $img (via buildx imagetools)"
            elif docker manifest inspect "$img" 2>/dev/null | grep -E "amd64|arm64" >/dev/null; then
              echo "✅ Verified $img (via docker manifest inspect)"
            else
              echo "❌ Failed to inspect $img"
              exit 1
            fi
          done
          echo "✅ All multi-arch container images verified."

  security-vulnerability-scan:
    name: Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Trivy Repository & Dependency Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

  real-install:
    name: Real Headless Install, Health Probes & Teardown (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Control Hub unit runs as the unprivileged `homelab` user with
      # WorkingDirectory inside the checkout. The runner's home is 0750, so the
      # service cannot start from $GITHUB_WORKSPACE; install from the production
      # location instead (what bootstrap.sh does on a real server).
      INSTALL_DIR: /opt/homelab-blueprint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Copy checkout to the production install location
        run: |
          sudo mkdir -p "$INSTALL_DIR"
          sudo cp -a "$GITHUB_WORKSPACE/." "$INSTALL_DIR/"
          sudo chown -R root:root "$INSTALL_DIR"

      - name: Headless install (not a dry run)
        run: |
          cd "$INSTALL_DIR"
          sudo ./setup.sh --headless --config testing/fixtures/ci_minimal.json

      - name: Installed artefacts exist with safe permissions
        run: |
          sudo test -f /etc/homelab/mediaserver.env
          sudo test -f /etc/homelab/control-hub.env
          sudo test -f /etc/homelab/control-hub.token
          sudo test -f /var/lib/homelab/installed.json
          sudo stat -c '%a %n' /etc/homelab/mediaserver.env | grep -q '^600 '
          sudo stat -c '%a %n' /etc/homelab/control-hub.token | grep -q '^640 '
          # Prowlarr key for the Control Hub indexer picker: group-readable by the service user only
          sudo test -f /etc/homelab/prowlarr.key
          sudo stat -c '%a %G %n' /etc/homelab/prowlarr.key | grep -q '^640 homelab '
          sudo test -f /etc/systemd/system/control-hub.service
          sudo test -f /etc/sudoers.d/homelab-blueprint
          sudo visudo -cf /etc/sudoers.d/homelab-blueprint
          sudo grep -q 'User=homelab' /etc/systemd/system/control-hub.service
          sudo grep -q "$INSTALL_DIR" /etc/systemd/system/control-hub.service
          # The install manifest must list the media stack so teardown can stop it
          sudo grep -q '"module": "media"' /var/lib/homelab/installed.json
          ! sudo grep -q '{{' /etc/systemd/system/control-hub.service

      - name: Services are up
        run: |
          systemctl is-active control-hub.service
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7575/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:7575/api/health
          # Control Hub must refuse unauthenticated API calls and accept the installed token
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7575/api/system/vitals)" = "401"
          TOKEN="$(sudo cat /etc/homelab/control-hub.token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:7575/api/system/vitals >/dev/null
          # Media stack
          docker ps --format '{{.Names}}\t{{.Status}}'
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8096/health && break; sleep 3; done
          curl -fsS http://127.0.0.1:8096/health
          curl -fsS http://127.0.0.1:7878/ping
          curl -fsS http://127.0.0.1:8989/ping
          curl -fsS http://127.0.0.1:9696/ping

      - name: Apps are wired together (fully configured, not just running)
        run: |
          RADARR_KEY="$(sudo grep -oP '(?<=<ApiKey>)[^<]+' /srv/homelab/appdata/mediaserver/radarr/config.xml)"
          SONARR_KEY="$(sudo grep -oP '(?<=<ApiKey>)[^<]+' /srv/homelab/appdata/mediaserver/sonarr/config.xml)"
          PROWLARR_KEY="$(sudo grep -oP '(?<=<ApiKey>)[^<]+' /srv/homelab/appdata/mediaserver/prowlarr/config.xml)"
          curl -fsS -H "X-Api-Key: $RADARR_KEY" http://127.0.0.1:7878/api/v3/downloadclient | grep -q '"name":"qBittorrent"'
          curl -fsS -H "X-Api-Key: $RADARR_KEY" http://127.0.0.1:7878/api/v3/rootfolder | grep -q '/data/media/movies'
          curl -fsS -H "X-Api-Key: $SONARR_KEY" http://127.0.0.1:8989/api/v3/downloadclient | grep -q '"name":"qBittorrent"'
          curl -fsS -H "X-Api-Key: $SONARR_KEY" http://127.0.0.1:8989/api/v3/rootfolder | grep -q '/data/media/tv'
          curl -fsS -H "X-Api-Key: $PROWLARR_KEY" http://127.0.0.1:9696/api/v1/applications | grep -q '"name":"Radarr"'
          curl -fsS -H "X-Api-Key: $PROWLARR_KEY" http://127.0.0.1:9696/api/v1/applications | grep -q '"name":"Sonarr"'
          curl -fsS http://127.0.0.1:8096/System/Info/Public | grep -q '"StartupWizardCompleted":true'
          # Indexer picker: Control Hub sees Prowlarr, nothing pre-selected, Prowlarr's own list is served
          TOKEN="$(sudo cat /etc/homelab/control-hub.token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:7575/api/indexers/status | tee /tmp/ix.json
          grep -q '"installed":true' /tmp/ix.json && grep -q '"reachable":true' /tmp/ix.json && grep -q '"configured":0' /tmp/ix.json
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:7575/api/indexers/available | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["count"] > 50, d; print("indexer definitions:", d["count"])'
          # qBittorrent accepts the generated password (read from the root-only env file)
          QB_PASS="$(sudo grep -oP '(?<=^QBITTORRENT_PASS=).*' /etc/homelab/mediaserver.env)"
          curl -fsS --data-urlencode "username=admin" --data-urlencode "password=$QB_PASS" http://127.0.0.1:8080/api/v2/auth/login | grep -q 'Ok'

      - name: Show logs on failure
        if: failure()
        run: |
          echo "::group::control-hub.service journal"
          sudo journalctl -u control-hub.service --no-pager -n 100 || true
          echo "::endgroup::"
          echo "::group::install manifest"
          sudo cat /var/lib/homelab/installed.json || true
          echo "::endgroup::"
          docker ps -a || true
          # The env file is root-only (0600), so compose needs sudo to read it.
          echo "::group::compose logs"
          sudo docker compose --env-file /etc/homelab/mediaserver.env -f "$INSTALL_DIR/apps/mediaserver/docker-compose.yml" logs --tail 80 || true
          echo "::endgroup::"
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::$c (state + health + last 60 log lines)"
            docker inspect --format '{{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$c" || true
            docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{.Output}}{{end}}{{end}}' "$c" | tail -n 5 || true
            sudo docker logs --tail 60 "$c" 2>&1 || true
            echo "::endgroup::"
          done
          sudo ls -la /srv/homelab/appdata/mediaserver/ || true

      - name: Teardown removes everything it installed
        # Runs after a failed install too: a half-installed stack must still be removable
        if: always()
        run: |
          cd "$INSTALL_DIR"
          sudo ./teardown.sh --yes
          ! sudo test -e /etc/homelab
          ! sudo test -e /var/lib/homelab
          ! sudo test -e /etc/systemd/system/control-hub.service
          ! sudo test -e /etc/sudoers.d/homelab-blueprint
          ! systemctl is-active --quiet control-hub.service
          test -z "$(docker ps -q)"
