# ==============================================================================
# Noodle Gallery (Open-Noodle, an Immich fork) - photo & video cloud stack
# ==============================================================================
# Quickstart:
#   1. cp .env.example .env
#   2. set storage paths and a DB_PASSWORD (required; nothing is shipped)
#   3. docker compose up -d
#
# Images are pinned to version tags (Dependabot proposes updates). Server and
# machine-learning images MUST stay on the same version.
# Container names keep the upstream immich_* convention because the Immich
# ecosystem (noodle-gallery-tools, backup and ML scheduler scripts) expects them.
# ==============================================================================

name: noodle-gallery

services:
  gallery-server:
    container_name: immich_server
    image: ghcr.io/open-noodle/gallery-server:v5.11.1
    # Upstream Immich alternative: ghcr.io/immich-app/immich-server:<version>
    volumes:
      - ${UPLOAD_LOCATION:-./data/uploads}:/data
      - ${THUMBS_LOCATION:-./data/thumbs}:/data/thumbs
      - ${ENCODED_VIDEO_LOCATION:-./data/encoded-video}:/data/encoded-video
      # Path and mode inside the container are configurable so an existing library keeps
      # the paths its database recorded (external library assets store absolute paths).
      - ${EXTERNAL_LIBRARY_LOCATION:-/mnt/hdd/Memories}:${EXTERNAL_LIBRARY_MOUNT_PATH:-/mnt/media}:${EXTERNAL_LIBRARY_MOUNT_MODE:-ro}
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (no default is shipped)}
    ports:
      - "${GALLERY_PORT:-2283}:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: false

  gallery-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/open-noodle/gallery-ml:v5.11.1
    # Upstream Immich alternative: ghcr.io/immich-app/immich-machine-learning:<version>
    networks:
      default:
        aliases:
          - immich-machine-learning
          - immich_machine_learning
    volumes:
      - model-cache:/cache
      - ${EXTERNAL_LIBRARY_LOCATION:-/mnt/hdd/Memories}:${EXTERNAL_LIBRARY_MOUNT_PATH:-/mnt/media}:ro
    env_file:
      - .env
    environment:
      # Matches the upstream v5 compose file.
      MACHINE_LEARNING_MODEL_REVISION: v2
    # "no": on low-power hosts the optional ML schedule module (noodle-gallery-tools
    # immich-ml-control.sh) starts and stops this container on a timer.
    # Set ML_RESTART_POLICY=unless-stopped in .env to keep it always on.
    restart: ${ML_RESTART_POLICY:-no}
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (no default is shipped)}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:-./data/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE_NAME:-immich}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  model-cache:
