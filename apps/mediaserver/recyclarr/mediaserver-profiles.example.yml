            enabled: true
          - name: WEBDL-720p
            enabled: true
          - name: WEBRip-720p
            enabled: true
          - name: Bluray-720p
            enabled: true
      - name: 1080p Compact
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - Hindi
            - "Season Complete"
            - "Multi Episode"
        min_format_score: 0
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: WEBDL-1080p
        qualities:
          - name: HDTV-1080p
            enabled: true
          - name: WEBDL-1080p
            enabled: true
          - name: WEBRip-1080p
            enabled: true
          - name: Bluray-1080p
            enabled: true
      - name: 4K Compact
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - Hindi
            - "Season Complete"
            - "Multi Episode"
        min_format_score: 0
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: WEBDL-2160p
        qualities:
          - name: HDTV-2160p
            enabled: true
          - name: WEBDL-2160p
            enabled: true
