# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Compact 720p, 1080p and 4K profiles with relaxed size limits for Hindi dual-audio & crisp WebDLs.
# Hindi audio has +50000 score priority: English is downloaded first if Hindi is unavailable,
# and automatically upgraded (previous English deleted) once Hindi audio is found.

radarr:
  mediaserver-movies:
    base_url: http://127.0.0.1:7878
    api_key: YOUR_RADARR_API_KEY

    quality_definition:
      type: movie
      qualities:
        - name: HDTV-720p
          min: 0
          preferred: 8.00
          max: 20.00
        - name: WEBDL-720p
          min: 0
          preferred: 10.00
          max: 25.00
        - name: WEBRip-720p
          min: 0
          preferred: 10.00
          max: 25.00
        - name: Bluray-720p
          min: 0
          preferred: 12.00
          max: 28.00
        - name: HDTV-1080p
          min: 0
          preferred: 15.00
          max: 32.00
        - name: WEBDL-1080p
          min: 0
          preferred: 20.00
          max: 42.00
        - name: WEBRip-1080p
          min: 0
          preferred: 20.00
          max: 42.00
        - name: Bluray-1080p
          min: 0
          preferred: 25.00
          max: 50.00
        - name: HDTV-2160p
          min: 0
          preferred: 40.00
          max: 80.00
        - name: WEBDL-2160p
          min: 0
          preferred: 55.00
          max: 120.00
        - name: WEBRip-2160p
          min: 0
          preferred: 55.00
          max: 120.00
        - name: Bluray-2160p
          min: 0
          preferred: 70.00
          max: 140.00

    custom_formats:
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        assign_scores_to:
          - name: 720p Compact
            score: 250
          - name: 1080p Compact
            score: 250
          - name: 4K Compact
            score: 250
    quality_profiles:
      - name: 720p Compact
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - Hindi
        min_format_score: 0
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: WEBDL-720p
        qualities:
          - name: HDTV-720p
            enabled: true
          - name: WEBDL-720p
            enabled: true
          - name: WEBRip-720p
            enabled: true
          - name: Bluray-720p
            enabled: true
      - name: 1080p Compact
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - Hindi
        min_format_score: 0
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: WEBDL-1080p
        qualities:
          - name: HDTV-1080p
            enabled: true
          - name: WEBDL-1080p
            enabled: true
          - name: WEBRip-1080p
            enabled: true
          - name: Bluray-1080p
            enabled: true
      - name: 4K Compact
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - Hindi
        min_format_score: 0
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: WEBDL-2160p
        qualities:
          - name: HDTV-2160p
            enabled: true
          - name: WEBDL-2160p
            enabled: true
          - name: WEBRip-2160p
            enabled: true
          - name: Bluray-2160p
            enabled: true

sonarr:
  mediaserver-series:
