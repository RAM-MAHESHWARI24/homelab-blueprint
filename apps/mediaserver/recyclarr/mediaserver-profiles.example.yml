          min: 0
          preferred: 5.00
          max: 15.00
        - name: WEBDL-720p
          min: 0
          preferred: 7.00
          max: 20.00
        - name: WEBRip-720p
          min: 0
          preferred: 7.00
          max: 20.00
        - name: Bluray-720p
          min: 0
          preferred: 8.00
          max: 22.00
        - name: HDTV-1080p
          min: 0
          preferred: 10.00
          max: 25.00
        - name: WEBDL-1080p
          min: 0
          preferred: 14.00
          max: 35.00
        - name: WEBRip-1080p
          min: 0
          preferred: 14.00
          max: 35.00
        - name: Bluray-1080p
          min: 0
          preferred: 18.00
          max: 40.00
        - name: HDTV-2160p
          min: 0
          preferred: 30.00
          max: 60.00
        - name: WEBDL-2160p
          min: 0
          preferred: 40.00
          max: 85.00
        - name: WEBRip-2160p
          min: 0
          preferred: 40.00
          max: 85.00
        - name: Bluray-2160p
          min: 0
          preferred: 50.00
          max: 100.00

    custom_formats:
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: 720p Compact
            score: 250
          - name: 1080p Compact
            score: 250
          - name: 4K Compact
            score: 250
    quality_profiles:
      - name: 720p Compact
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - Hindi
            - "Season Complete"
            - "Multi Episode"
        min_format_score: 0
        min_upgrade_format_score: 1
        upgrade:
          allowed: true
          until_quality: WEBDL-720p
        qualities:
