<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Official Icons Test</title>
<style>
body { background: #0c1322; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 40px; }
.card { background: #131b2e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 20px; width: 150px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.icon-box { width: 54px; height: 54px; margin: 0 auto 12px; background: rgba(10, 16, 30, 0.95); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.icon-box img { width: 100%; height: 100%; object-fit: contain; }
.label { font-size: 0.9rem; font-weight: 600; }
.sub { font-size: 0.72rem; color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card"><div class="icon-box"><img src="/img/icons/jellyfin.svg" /></div><div class="label">Jellyfin</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/seerr.svg" /></div><div class="label">Jellyseerr</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/immich.svg" /></div><div class="label">Immich</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/sonarr.svg" /></div><div class="label">Sonarr</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/radarr.svg" /></div><div class="label">Radarr</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/prowlarr.svg" /></div><div class="label">Prowlarr</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/bazarr.svg" /></div><div class="label">Bazarr</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/qbittorrent.svg" /></div><div class="label">qBittorrent</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/dozzle.svg" /></div><div class="label">Dozzle</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/byparr.svg" /></div><div class="label">FlareSolverr</div></div>
  <div class="card"><div class="icon-box"><img src="/img/icons/cockpit.svg" /></div><div class="label">Cockpit</div></div>
</body>
</html>
