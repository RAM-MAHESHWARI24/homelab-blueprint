name: Control Hub Standalone CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Daemon Test Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Standalone Test Suite
        run: |
          python -m unittest discover -s tests

  lint-and-docker:
    name: ShellCheck & Docker Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ShellCheck Launcher Script
        run: |
          shellcheck run.sh

      - name: Validate Compose Config
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid."

      - name: Test Docker Container Build
        run: |
          docker build -t control-hub:latest .
